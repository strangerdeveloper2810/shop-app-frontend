<footer class="relative bg-stone-50 dark:bg-stone-900 border-t border-stone-200/60 dark:border-stone-800">
  <!-- Warm accent line -->
  <div class="absolute top-0 left-0 right-0 h-[2px] bg-gradient-to-r from-primary-300 via-accent-400 to-primary-300"></div>

  <div class="container mx-auto px-4 py-12">
    <!-- Main footer content -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-8">
      <!-- Company Info -->
      <div class="space-y-4">
        <h3 class="text-2xl font-display font-bold text-primary-600 dark:text-primary-400">
          ShopApp
        </h3>
        <p class="text-stone-500 dark:text-stone-400 text-sm leading-relaxed">
          Nền tảng thương mại điện tử đáng tin cậy. Chúng tôi mang đến sự xuất sắc trong mọi đơn hàng và đảm bảo sự hài lòng của khách hàng.
        </p>
      </div>

      <!-- Quick Links -->
      <div class="space-y-4">
        <h4 class="text-lg font-display font-semibold text-stone-800 dark:text-stone-100">
          Liên kết nhanh
        </h4>
        <nav class="flex flex-col space-y-2">
          <a
            routerLink="/home"
            class="text-stone-500 dark:text-stone-400 hover:text-primary-600 dark:hover:text-primary-400 transition-colors duration-200 text-sm font-medium"
          >
            Trang chủ
          </a>
          <a
            routerLink="/products"
            class="text-stone-500 dark:text-stone-400 hover:text-primary-600 dark:hover:text-primary-400 transition-colors duration-200 text-sm font-medium"
          >
            Sản phẩm
          </a>
          <a
            routerLink="/orders"
            class="text-stone-500 dark:text-stone-400 hover:text-primary-600 dark:hover:text-primary-400 transition-colors duration-200 text-sm font-medium"
          >
            Đơn hàng
          </a>
        </nav>
      </div>

      <!-- Contact Info -->
      <div class="space-y-4">
        <h4 class="text-lg font-display font-semibold text-stone-800 dark:text-stone-100">
          Liên hệ
        </h4>
        <div class="space-y-3">
          <a
            href="mailto:support@shopapp.com"
            class="flex items-center space-x-3 text-stone-500 dark:text-stone-400 hover:text-primary-600 dark:hover:text-primary-400 transition-colors duration-200 group"
          >
            <div class="flex-shrink-0 w-9 h-9 rounded-full bg-primary-100 dark:bg-primary-900/30 flex items-center justify-center group-hover:bg-primary-200 dark:group-hover:bg-primary-900/50 transition-colors duration-200">
              <lucide-icon
                [img]="Mail"
                [size]="16"
                class="text-primary-600 dark:text-primary-400"
              ></lucide-icon>
            </div>
            <span class="text-sm font-medium">support&#64;shopapp.com</span>
          </a>
          <a
            href="tel:+84123456789"
            class="flex items-center space-x-3 text-stone-500 dark:text-stone-400 hover:text-accent-600 dark:hover:text-accent-400 transition-colors duration-200 group"
          >
            <div class="flex-shrink-0 w-9 h-9 rounded-full bg-accent-100 dark:bg-accent-900/30 flex items-center justify-center group-hover:bg-accent-200 dark:group-hover:bg-accent-900/50 transition-colors duration-200">
              <lucide-icon
                [img]="Phone"
                [size]="16"
                class="text-accent-600 dark:text-accent-400"
              ></lucide-icon>
            </div>
            <span class="text-sm font-medium">+84 123 456 789</span>
          </a>
        </div>
      </div>
    </div>

    <!-- Bottom bar -->
    <div class="pt-8 border-t border-stone-200 dark:border-stone-800">
      <div class="flex flex-col md:flex-row justify-between items-center space-y-4 md:space-y-0">
        <p class="text-sm text-stone-500 dark:text-stone-400">
          &copy; {{ currentYear }} ShopApp. All rights reserved.
        </p>

        <!-- Social links -->
        <div class="flex items-center space-x-3">
          <a
            href="https://github.com"
            target="_blank"
            rel="noopener noreferrer"
            class="w-10 h-10 rounded-full bg-stone-100 dark:bg-stone-800 flex items-center justify-center hover:bg-primary-100 dark:hover:bg-primary-900/30 hover:scale-110 transition-all duration-200 group"
            aria-label="GitHub"
          >
            <lucide-icon
              [img]="Github"
              [size]="18"
              class="text-stone-500 dark:text-stone-400 group-hover:text-primary-600 dark:group-hover:text-primary-400"
            ></lucide-icon>
          </a>
          <a
            href="https://twitter.com"
            target="_blank"
            rel="noopener noreferrer"
            class="w-10 h-10 rounded-full bg-stone-100 dark:bg-stone-800 flex items-center justify-center hover:bg-accent-100 dark:hover:bg-accent-900/30 hover:scale-110 transition-all duration-200 group"
            aria-label="Twitter"
          >
            <lucide-icon
              [img]="Twitter"
              [size]="18"
              class="text-stone-500 dark:text-stone-400 group-hover:text-accent-600 dark:group-hover:text-accent-400"
            ></lucide-icon>
          </a>
        </div>
      </div>
    </div>
  </div>
</footer>
